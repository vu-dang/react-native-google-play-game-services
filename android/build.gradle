
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.shokimble.rngoogleplaygameservices"
    compileSdk 35

    defaultConfig {
        minSdk 24
        versionCode 3
        versionName "2.0"
    }

    lint {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
    implementation 'com.facebook.react:react-native:+'
}
